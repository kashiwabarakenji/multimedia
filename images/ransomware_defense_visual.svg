<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="infectGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="safeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad)" />

  <!-- Title -->
  <text x="640" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    ランサムウェアの猛威 vs 最強の自衛策「3-2-1バックアップ原則」
  </text>
  <text x="640" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">
    なぜ繋ぎっぱなしのハードディスクは全滅するのか？ 唯一身代金を払わずに勝つ方法
  </text>

  <!-- ==================== LEFT: THE ATTACK ==================== -->
  <g transform="translate(80, 115)">
    <!-- Header -->
    <rect width="520" height="42" rx="8" fill="#dc2626" />
    <text x="260" y="27" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">
      💀 ランサムウェア感染：PCと常時接続機器が全滅
    </text>

    <!-- Content Box -->
    <rect y="55" width="520" height="380" rx="12" fill="url(#infectGrad)" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)" />

    <!-- PC Monitor with Lock -->
    <rect x="40" y="80" width="230" height="150" rx="8" fill="#1e1b4b" stroke="#f87171" stroke-width="2" />
    <rect x="50" y="90" width="210" height="130" rx="4" fill="#7f1d1d" />
    <text x="155" y="135" font-size="34" text-anchor="middle">🔒</text>
    <text x="155" y="165" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#fecaca" text-anchor="middle">FILES ENCRYPTED!</text>
    <text x="155" y="185" font-family="'Courier New', monospace" font-size="11" fill="#fca5a5" text-anchor="middle">Pay 5.0 BTC Ransom</text>

    <!-- Monitor Stand -->
    <rect x="140" y="230" width="30" height="25" fill="#312e81" />
    <rect x="110" y="255" width="90" height="8" rx="3" fill="#312e81" />

    <!-- Connected NAS/HDD (also encrypted) -->
    <g transform="translate(310, 95)">
      <rect width="170" height="130" rx="8" fill="#18181b" stroke="#ef4444" stroke-width="2" />
      <text x="85" y="35" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fca5a5" text-anchor="middle">繋ぎっぱなしの外付けHDD</text>
      <text x="85" y="70" font-size="28" text-anchor="middle">💥🔒</text>
      <text x="85" y="105" font-family="sans-serif" font-size="12" fill="#f87171" text-anchor="middle">バックアップも道連れ暗号化</text>
      <!-- Cable -->
      <path d="M -40,65 L 0,65" stroke="#ef4444" stroke-width="3" stroke-dasharray="4,3" />
    </g>

    <!-- Danger warning box -->
    <rect x="30" y="280" width="460" height="130" rx="8" fill="#260404" stroke="#7f1d1d" />
    <text x="45" y="310" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ef4444">⚠️ 「USBを挿したまま」が最大の落とし穴！</text>
    <text x="45" y="335" font-family="sans-serif" font-size="13" fill="#fecaca">・マルウェアはPC内だけでなく、接続されたドライブも探索</text>
    <text x="45" y="358" font-family="sans-serif" font-size="13" fill="#fecaca">・社内共有フォルダ（NAS）や常時同期クラウドも一網打尽</text>
    <text x="45" y="385" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f87171">結果：身代金を払うしか選択肢がなくなる…</text>
  </g>

  <!-- ==================== RIGHT: 3-2-1 BACKUP DEFENSE ==================== -->
  <g transform="translate(680, 115)">
    <!-- Header -->
    <rect width="520" height="42" rx="8" fill="#10b981" />
    <text x="260" y="27" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">
      🛡️ 鉄壁の防御：3-2-1バックアップルール
    </text>

    <!-- Content Box -->
    <rect y="55" width="520" height="380" rx="12" fill="url(#safeGrad)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)" />

    <!-- 3-2-1 Cards -->
    <g transform="translate(25, 75)">
      <!-- Step 3 -->
      <rect width="470" height="65" rx="8" fill="#022c22" stroke="#059669" />
      <circle cx="35" cy="32" r="20" fill="#059669" />
      <text x="35" y="40" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
      <text x="75" y="28" font-family="sans-serif" font-size="15" font-weight="bold" fill="#6ee7b7">データは「3つ」のコピーを持つ</text>
      <text x="75" y="50" font-family="sans-serif" font-size="12" fill="#a7f3d0">原本データ（PC本体）＋ 2つのバックアップコピーを作成</text>

      <!-- Step 2 -->
      <rect y="78" width="470" height="65" rx="8" fill="#022c22" stroke="#059669" />
      <circle cx="35" cy="110" r="20" fill="#059669" />
      <text x="35" y="118" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
      <text x="75" y="106" font-family="sans-serif" font-size="15" font-weight="bold" fill="#6ee7b7">「2種類」の異なるメディアに分ける</text>
      <text x="75" y="128" font-family="sans-serif" font-size="12" fill="#a7f3d0">PC内蔵SSDだけでなく、外付けHDDや別ストレージに分散</text>

      <!-- Step 1 (THE HERO) -->
      <rect y="156" width="470" height="95" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="2" />
      <circle cx="35" cy="203" r="22" fill="#10b981" />
      <text x="35" y="211" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
      <text x="75" y="186" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fef08a">「1つ」は物理オフライン（隔離）保管！</text>
      <text x="75" y="210" font-family="sans-serif" font-size="13" fill="#ffffff">バックアップ完了後、ケーブルを抜いて金庫にしまう。</text>
      <text x="75" y="232" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a7f3d0">★ ネットから切断されていれば、ウイルスは絶対に届かない！</text>
    </g>

    <!-- Victory banner -->
    <rect x="25" y="345" width="470" height="70" rx="8" fill="#022c22" stroke="#10b981" />
    <text x="260" y="373" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
      🎉 結果：PCを初期化し、オフラインHDDから丸ごと復元！
    </text>
    <text x="260" y="398" font-family="sans-serif" font-size="13" fill="#6ee7b7" text-anchor="middle">
      身代金の支払いは一切不要（被害額ゼロで業務再開 ✅）
    </text>
  </g>

  <!-- ==================== BOTTOM TAKEAWAY ==================== -->
  <g transform="translate(80, 635)">
    <rect width="1120" height="55" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="560" y="34" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e2e8f0" text-anchor="middle">
      💡 教訓：「バックアップを取っている」だけでは不十分。物理的にネットワークから抜いたオフライン保管こそが真の命綱！
    </text>
  </g>
</svg>
