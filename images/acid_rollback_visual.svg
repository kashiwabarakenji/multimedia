<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>
    <linearGradient id="bankGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad)" />

  <!-- Title -->
  <text x="640" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    データベースの命綱「トランザクション（All or Nothing）」とロールバック
  </text>
  <text x="640" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">
    銀行振込で通信が途絶えても、なぜ私たちのお金は1円も消えないのか？
  </text>

  <!-- ==================== SCENARIO: BANK TRANSFER CRASH ==================== -->
  <g transform="translate(80, 120)">
    <!-- Account A Card -->
    <g transform="translate(0, 0)">
      <rect width="320" height="220" rx="12" fill="url(#bankGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)" />
      <rect x="20" y="20" width="60" height="60" rx="30" fill="#0284c7" opacity="0.2" />
      <text x="50" y="58" font-size="30" text-anchor="middle">👤</text>
      <text x="95" y="45" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">振込元：山田さんの口座</text>
      <text x="95" y="68" font-family="sans-serif" font-size="13" fill="#94a3b8">普通預金 A銀行</text>

      <line x1="20" y1="100" x2="300" y2="100" stroke="#475569" stroke-width="1" />

      <text x="30" y="130" font-family="sans-serif" font-size="13" fill="#cbd5e1">初期残高: 100,000 円</text>
      <text x="30" y="155" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f87171">ステップ①：10,000円出金</text>
      <rect x="25" y="170" width="270" height="35" rx="6" fill="#0f172a" />
      <text x="160" y="193" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">仮残高: 90,000 円</text>
    </g>

    <!-- Transfer Flow in Middle -->
    <g transform="translate(350, 20)">
      <!-- Transfer Arrow -->
      <path d="M 0,50 L 120,50" stroke="#fbbf24" stroke-width="4" stroke-dasharray="6,4" />
      <polygon points="120,50 105,42 105,58" fill="#fbbf24" />
      <text x="60" y="35" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fde047" text-anchor="middle">振込 10,000円</text>

      <!-- CRASH EXPLOSION -->
      <g transform="translate(60, 110)">
        <circle cx="0" cy="0" r="45" fill="#ef4444" opacity="0.2" />
        <circle cx="0" cy="0" r="32" fill="#dc2626" opacity="0.4" />
        <text x="0" y="10" font-size="34" text-anchor="middle">💥</text>
        <rect x="-80" y="45" width="160" height="30" rx="4" fill="#991b1b" />
        <text x="0" y="65" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">通信途絶 / DBダウン！</text>
      </g>
    </g>

    <!-- Account B Card -->
    <g transform="translate(500, 0)">
      <rect width="320" height="220" rx="12" fill="url(#bankGrad)" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)" opacity="0.8" />
      <rect x="20" y="20" width="60" height="60" rx="30" fill="#475569" opacity="0.2" />
      <text x="50" y="58" font-size="30" text-anchor="middle">🏪</text>
      <text x="95" y="45" font-family="sans-serif" font-size="16" font-weight="bold" fill="#cbd5e1">振込先：佐藤さんの口座</text>
      <text x="95" y="68" font-family="sans-serif" font-size="13" fill="#64748b">普通預金 B銀行</text>

      <line x1="20" y1="100" x2="300" y2="100" stroke="#475569" stroke-width="1" />

      <text x="30" y="130" font-family="sans-serif" font-size="13" fill="#64748b">初期残高: 50,000 円</text>
      <text x="30" y="155" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ef4444">ステップ②：入金処理が未達！</text>
      <rect x="25" y="170" width="270" height="35" rx="6" fill="#0f172a" />
      <text x="160" y="193" font-family="'Courier New', monospace" font-size="15" fill="#ef4444" text-anchor="middle">❌ 1円も届いていない</text>
    </g>

    <!-- Right Side: The Dilemma without ACID -->
    <g transform="translate(850, 0)">
      <rect width="270" height="220" rx="12" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" />
      <text x="135" y="35" font-family="sans-serif" font-size="15" font-weight="bold" fill="#fca5a5" text-anchor="middle">
        もし仕組みがなかったら？
      </text>
      <text x="20" y="70" font-family="sans-serif" font-size="13" fill="#fecaca">・山田さんの口座は -1万円</text>
      <text x="20" y="95" font-family="sans-serif" font-size="13" fill="#fecaca">・佐藤さんの口座は +0円</text>
      <line x1="20" y1="115" x2="250" y2="115" stroke="#7f1d1d" />
      <text x="135" y="145" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ef4444" text-anchor="middle">
        😱 1万円が宇宙の彼方に消滅！
      </text>
      <text x="135" y="170" font-family="sans-serif" font-size="12" fill="#fca5a5" text-anchor="middle">
        （社会的大混乱・信頼失墜）
      </text>
    </g>

    <!-- ==================== BOTTOM: ACID ROLLBACK MECHANISM ==================== -->
    <g transform="translate(0, 250)">
      <rect width="1120" height="200" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2" filter="url(#shadow)" />

      <!-- Rollback Icon & Heading -->
      <circle cx="60" cy="50" r="30" fill="#059669" />
      <text x="60" y="60" font-size="30" text-anchor="middle">🔄</text>

      <text x="110" y="45" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff">
        救世主：トランザクション管理機構による「ロールバック（Rollback）」
      </text>
      <text x="110" y="72" font-family="sans-serif" font-size="14" fill="#a7f3d0">
        途中障害を検知した瞬間、データベースが時計の針を完全に「処理前」へと巻き戻す！
      </text>

      <!-- 3 Step Resolution -->
      <g transform="translate(30, 95)">
        <!-- Box 1 -->
        <rect width="330" height="85" rx="8" fill="#022c22" stroke="#047857" />
        <text x="20" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#34d399">1. 不可分性（Atomicity）</text>
        <text x="20" y="55" font-family="sans-serif" font-size="12" fill="#d1fae5">「出金と入金」を1つの運命共同体</text>
        <text x="20" y="72" font-family="sans-serif" font-size="12" fill="#d1fae5">として扱い、中間状態を許さない</text>

        <!-- Box 2 -->
        <rect x="360" width="340" height="85" rx="8" fill="#022c22" stroke="#047857" />
        <text x="380" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#34d399">2. 自動巻き戻し（Rollback）</text>
        <text x="380" y="55" font-family="sans-serif" font-size="12" fill="#d1fae5">山田さんの仮残高90,000円を</text>
        <text x="380" y="72" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fef08a">瞬時に100,000円へと元通り復元！</text>

        <!-- Box 3 -->
        <rect x="730" width="330" height="85" rx="8" fill="#022c22" stroke="#047857" />
        <text x="750" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#34d399">3. 一貫性の完全防衛（Consistency）</text>
        <text x="750" y="55" font-family="sans-serif" font-size="12" fill="#d1fae5">「振込エラー：やり直してください」</text>
        <text x="750" y="72" font-family="sans-serif" font-size="12" fill="#a7f3d0">と通知。損失ゼロで安全終了 ✅</text>
      </g>
    </g>
  </g>
</svg>
